<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Rango — abertura (voo sobre telas reais)</title><link rel="icon" href="data:,">
<style>
  html, body { margin: 0; width: 1080px; height: 1920px; overflow: hidden; background: #fff; font-family: Inter, system-ui, sans-serif; }
  .view { position: absolute; inset: 0; overflow: hidden; background: linear-gradient(180deg, #ffffff 0%, #eaf2ff 55%, #d6e6ff 100%); perspective: 1150px; perspective-origin: 50% 46%; }
  .world { position: absolute; left: 540px; top: 960px; width: 0; height: 0; transform-style: preserve-3d; transform-origin: 0 0;
           animation: flight 3.5s cubic-bezier(.16, .62, .12, 1) both; }
  .plane { position: absolute; left: -2200px; top: -1600px; width: 4400px; height: 6400px; background: radial-gradient(closest-side, rgba(21,96,229,.16), transparent); transform: translateZ(-2px); }
  .card { position: absolute; width: 372px; height: 760px; margin: -380px 0 0 -186px; border-radius: 62px; background: #0b0f17; padding: 12px; box-sizing: border-box;
          box-shadow: 0 40px 70px -28px rgba(10, 30, 74, .55), inset 0 0 0 3px #5b6678; transform: translate3d(var(--x), var(--y), 0); }
  .card img { width: 100%; height: 100%; object-fit: cover; object-position: top; display: block; border-radius: 50px; background: #f1f5fb; }
  .card::before { content: ""; position: absolute; left: 50%; top: 22px; width: 104px; height: 30px; margin-left: -52px; border-radius: 20px; background: #000; z-index: 2; }
  .card::after { content: ""; position: absolute; inset: 12px; border-radius: 50px; background: linear-gradient(115deg, rgba(255,255,255,.22), transparent 38%); }
  .word { position: absolute; transform: translate3d(var(--x), var(--y), 4px) skewX(-10deg); font: italic 900 150px/1 "Inter Display", Inter, sans-serif; letter-spacing: -.03em; color: #0a1e4a; white-space: nowrap; }
  .word.b { color: #1560e5; }
  .tint { position: absolute; inset: 0; background: #1560e5; opacity: 0; animation: tint 700ms ease-in-out 3.0s both; }
  .lock { position: absolute; inset: 0; background: linear-gradient(160deg, #2b78f2 0%, #1560e5 45%, #0b3a9e 100%); opacity: 0; animation: lock-in 600ms ease-out 3.2s both; overflow: hidden; }
  .logo { position: absolute; left: 50%; top: 560px; width: 820px; aspect-ratio: 903 / 414; margin-left: -410px; background: #fff; -webkit-mask: url("../assets/logo_rango.png") center / contain no-repeat; mask: url("../assets/logo_rango.png") center / contain no-repeat;
          animation: logo-in 800ms cubic-bezier(.16, 1, .3, 1) 3.45s both; }
  .tag { position: absolute; left: 0; right: 0; top: 960px; text-align: center; color: #dcecff; font: 600 44px Inter, sans-serif; letter-spacing: .01em; animation: rise 600ms ease-out 4.0s both; }
  .fan { position: absolute; left: 50%; top: 1130px; width: 0; height: 0; }
  .fan .card { margin: 0; width: 300px; height: 612px; left: -150px; top: 0; transform: translate3d(var(--fx), var(--fy), 0) rotate(var(--fr)); animation: fan-in 800ms cubic-bezier(.16, 1, .3, 1) calc(3.6s + var(--d)) both; box-shadow: 0 30px 60px -24px rgba(0, 12, 50, .6); }
  @keyframes flight {
    from { transform: rotateX(72deg) rotateZ(-16deg) translate3d(160px, -3300px, 0); }
    to   { transform: rotateX(30deg) rotateZ(0deg) translate3d(0px, -300px, 120px); }
  }
  @keyframes tint { to { opacity: 1; } }
  @keyframes lock-in { to { opacity: 1; } }
  @keyframes logo-in { from { opacity: 0; transform: translate3d(0, 40px, 0) scale(.92); } to { opacity: 1; transform: none; } }
  @keyframes rise { from { opacity: 0; transform: translate3d(0, 16px, 0); } to { opacity: 1; transform: none; } }
  @keyframes fan-in { from { opacity: 0; transform: translate3d(var(--fx), calc(var(--fy) + 260px), 0) rotate(var(--fr)) scale(.9); } to { opacity: 1; transform: translate3d(var(--fx), var(--fy), 0) rotate(var(--fr)); } }
</style></head>
<body>
<div class="view">
  <div class="world" id="world"><div class="plane"></div></div>
  <div class="tint"></div>
  <div class="lock">
    <div class="logo"></div><div class="tag">Sua operação, conectada.</div>
    <div class="fan">
      <div class="card" style="--fx:-330px;--fy:60px;--fr:-9deg;--d:140ms"><img src="./screens/pedidos.jpg" alt=""></div>
      <div class="card" style="--fx:330px;--fy:60px;--fr:9deg;--d:140ms"><img src="./screens/relatorios.jpg" alt=""></div>
      <div class="card" style="--fx:0px;--fy:-8px;--fr:0deg;--d:0ms"><img src="./screens/dashboard.jpg" alt=""></div>
    </div>
  </div>
</div>
<script>
  const shots = ['dashboard', 'lancar-venda', 'pedidos', 'relatorios', 'estoque', 'perdas', 'historico', 'receitas', 'cmv', 'funcionarios', 'dashboard-b', 'dashboard'];
  const world = document.getElementById('world'); let n = 0;
  for (let r = 0; r < 5; r++) for (let c = 0; c < 3; c++) {
    const d = document.createElement('div'); d.className = 'card'; const x = (c - 1) * 470 + (r % 2 ? 150 : -60), y = r * 900 + (c === 1 ? 220 : 0) - 700;
    d.style.setProperty('--x', x + 'px'); d.style.setProperty('--y', y + 'px'); d.innerHTML = `<img src="./screens/${shots[n++ % shots.length]}.jpg" alt="">`; world.appendChild(d);
  }
  [['Pedidos.', -520, 120, ''], ['Entregas.', -140, 1020, 'b'], ['WhatsApp.', -480, 1920, ''], ['Estoque.', -120, 2820, 'b']].forEach(([t, x, y, k]) => {
    const w = document.createElement('div'); w.className = 'word ' + k; w.textContent = t; w.style.setProperty('--x', x + 'px'); w.style.setProperty('--y', y + 'px'); world.appendChild(w);
  });
  window.__seek = (ms) => { for (const a of document.getAnimations()) { a.pause(); a.currentTime = ms; } };
  window.__ready = Promise.all([...document.images].map((i) => i.decode().catch(() => {}))).then(() => true);
</script>
</body></html>
